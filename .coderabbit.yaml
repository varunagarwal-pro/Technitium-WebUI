# CodeRabbit Master Review Configuration — Technitium-WebUI
# Reference: Docs/CodeRabbit.md
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  changed_files_summary: true
  collapse_walkthrough: true
  poem: false
  in_progress_fortune: false
  review_status: true
  commit_status: true
  enable_prompt_for_ai_agents: true

  slop_detection:
    enabled: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "deploy/sentinel-console"

  finishing_touches:
    autofix:
      enabled: true
    fix_ci:
      enabled: true
    resolve_merge_conflict:
      enabled: true
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  tools:
    biome:
      enabled: true
    htmlhint:
      enabled: true
    stylelint:
      enabled: true
    gitleaks:
      enabled: true

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/temp/**"

  path_instructions:
    - path: "{src,web}/**"
      instructions: |
        Ensure pure client-side administration interface architecture (no backend server or database dependencies).
        Maintain full parity with Technitium DNS Server HTTP API and responsive light/dark themes.

knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: "auto"

chat:
  auto_reply: true
